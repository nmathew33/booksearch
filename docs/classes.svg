<text xml:space="preserve" text-anchor="start" x="201.27" y="-172.69" font-family="DejaVu Sans" font-size="11.00">UML notation</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-159.19" font-family="DejaVu Sans" font-size="11.00">Filled diamond at owner: composition</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-145.69" font-family="DejaVu Sans" font-size="11.00">Dashed line + hollow triangle: implements interface</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-132.19" font-family="DejaVu Sans" font-size="11.00">Dashed arrow: dependency</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-105.69" font-family="DejaVu Sans" font-size="11.00">ProcessorFactory creates an independent Processor.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-92.19" font-family="DejaVu Sans" font-size="11.00">DocumentInput owns filename, documentPath, and body.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-78.69" font-family="DejaVu Sans" font-size="11.00">ExtractedDocument contains text and source mappings.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-65.19" font-family="DejaVu Sans" font-size="11.00">Matches own their text and source locations.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-51.69" font-family="DejaVu Sans" font-size="11.00">Query is immutable during a run.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-25.19" font-family="DejaVu Sans" font-size="11.00">DocumentInput is implemented.</text>
<text xml:space="preserve" text-anchor="start" x="201.27" y="-11.69" font-family="DejaVu Sans" font-size="11.00">The remaining API is proposed.</text>
</g>
